name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install deps
        working-directory: frontend/CaloriePaws/my-app
        run: npm ci

      - name: Build
        working-directory: frontend/CaloriePaws/my-app
        run: npm run build

      # ⬇️ ขอ GitHub OIDC token
      - name: Get Id Token
        id: idtoken
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            return await core.getIDToken();
          result-encoding: string

      # ⬇️ ส่ง token ให้ SWA (ไม่ต้องใช้ secret แล้ว)
      - name: Deploy (skip app build)
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: frontend/CaloriePaws/my-app
          output_location: dist
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
